name: hermes-r0b0t-vibeCAD
version: 0.4.0
description: "Profile-driven build123d CAD and local STL mesh preparation for FDM printers, with bed-fit refusals, detail previews, and Bambu X2D / P2S handoffs. Executes trusted workspace models locally; does not dispatch prints or bind a live AMS."
author: "r0b0t / Hermes Agent"
license: MIT
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.0"
tags: [cad, build123d, 3d-printing, fdm, slicer]
provides_hooks:
  - pre_tool_call
provides_tools:
  - vibecad_list_printer_profiles
  - vibecad_execute_and_export
  - vibecad_inspect_metrics
  - vibecad_generate_preview_renders
  - vibecad_modify_parameter
  - vibecad_stage_for_slicer
  - vibecad_prepare_mesh
  - vibecad_stage_for_bambu
# CAD dependencies are installed into the separately configured Python sidecar.
python_runtime: external
config_schema:
  workspace_root:
    type: str
    default: "~/vibecad-projects"
    description: "Trusted workspace root containing CAD projects."
  python_executable:
    type: str
    default: ""
    description: "Python interpreter with the CAD extra installed; empty means current interpreter if dependencies are present."
  printer_profile:
    type: str
    default: ""
    description: "Required printer profile id. Bundled ids: generic-fdm-220, bambu-x2d, bambu-p2s."
  printer_profiles_file:
    type: str
    default: ""
    description: "Optional JSON printer-profile catalog; empty uses bundled profiles."
  timeout_s:
    type: int
    default: 120
    description: "Per-CAD subprocess timeout, clamped to 1..300 seconds."
