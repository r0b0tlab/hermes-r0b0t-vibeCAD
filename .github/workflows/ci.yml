name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
      - run: uv sync --all-extras
      - run: uv run pytest -q
      - run: node --experimental-vm-modules --test tests/desktop.test.mjs
      - run: python -m compileall -q .
      - run: python scripts/check_release_tree.py

  hermes-doctor:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          path: hermes-agent
      - run: uv sync --directory hermes-agent
      - run: HERMES_HOME="$(mktemp -d)" hermes-agent/.venv/bin/hermes plugins doctor . --ci
