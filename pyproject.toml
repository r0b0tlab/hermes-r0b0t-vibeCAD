[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-r0b0t-vibecad"
version = "0.4.1"
description = "Profile-driven Hermes build123d plugin for FDM printers, including Bambu X2D and P2S AMS Combo handoffs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "r0b0t" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
cad = [
  "build123d>=0.11.1,<0.12",
  "trimesh>=4.12.2,<6",
  "numpy>=2.5.2,<3",
  "Pillow>=12.3.0,<13",
  "lib3mf>=2.5.0,<3",
]
test = ["pytest>=8.3.5,<9", "hatchling>=1.27.0,<2"]

[tool.hatch.build]
include = [
  "plugin.yaml",
  "__init__.py",
  "*.py",
  "profiles/*.json",
  "scripts/*.py",
  "desktop/plugin.js",
  "skills/**",
]

# The Hermes plugin remains rooted at the repository top level. Map the same
# sources into a conventional import package only when building a wheel.
[tool.hatch.build.targets.wheel]
only-include = ["hermes_r0b0t_vibecad"]

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "hermes_r0b0t_vibecad/__init__.py"
"_cad_supervisor.py" = "hermes_r0b0t_vibecad/_cad_supervisor.py"
"adapters.py" = "hermes_r0b0t_vibecad/adapters.py"
"bambu.py" = "hermes_r0b0t_vibecad/bambu.py"
"config.py" = "hermes_r0b0t_vibecad/config.py"
"exports.py" = "hermes_r0b0t_vibecad/exports.py"
"geometry.py" = "hermes_r0b0t_vibecad/geometry.py"
"handoff.py" = "hermes_r0b0t_vibecad/handoff.py"
"mesh_bridge.py" = "hermes_r0b0t_vibecad/mesh_bridge.py"
"parameters.py" = "hermes_r0b0t_vibecad/parameters.py"
"profiles.py" = "hermes_r0b0t_vibecad/profiles.py"
"renders.py" = "hermes_r0b0t_vibecad/renders.py"
"runtime.py" = "hermes_r0b0t_vibecad/runtime.py"
"schemas.py" = "hermes_r0b0t_vibecad/schemas.py"
"plugin.yaml" = "hermes_r0b0t_vibecad/plugin.yaml"
"profiles" = "hermes_r0b0t_vibecad/profiles"
"scripts" = "hermes_r0b0t_vibecad/scripts"
"desktop/plugin.js" = "hermes_r0b0t_vibecad/desktop/plugin.js"
"skills" = "hermes_r0b0t_vibecad/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
